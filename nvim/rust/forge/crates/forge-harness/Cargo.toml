[package]
name = "forge-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-provider-api = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
dunce = { workspace = true }
forge-buffer = { workspace = true }
forge-diff = { workspace = true }
forge-git = { workspace = true }
forge-protocol = { workspace = true }
forge-providers = { workspace = true }
forge-shell = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
process-wrap = { workspace = true, features = ["tokio1", "job-object", "kill-on-drop", "process-group", "creation-flags"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rusqlite = { workspace = true, features = ["bundled"] }
schemars = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_path_to_error = { workspace = true }
serde_stacker = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
spdx = { workspace = true }
stacker = { workspace = true }
strip-ansi-escapes = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
toml = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
tree-sitter = { workspace = true }

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }
