[package]
name = "forge-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["unstable_session_fork"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dunce = { workspace = true }
forge-buffer = { workspace = true }
forge-diff = { workspace = true }
forge-git = { workspace = true }
forge-protocol = { workspace = true }
futures-util = { workspace = true }
github-copilot-sdk = { workspace = true, features = ["derive"] }
hex = { workspace = true }
home = { workspace = true }
jsonschema = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
process-wrap = { workspace = true, features = ["tokio1", "job-object", "kill-on-drop", "process-group", "creation-flags"] }
quote = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rusqlite = { workspace = true, features = ["bundled"] }
schemars = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_path_to_error = { workspace = true }
serde_stacker = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
spdx = { workspace = true }
stacker = { workspace = true }
strip-ansi-escapes = { workspace = true }
syn = { workspace = true, features = ["full", "visit-mut"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-powershell = { workspace = true }
tree-sitter-zsh = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }
