[package]
name = "forge-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
futures-util = "0.3"
forge-protocol = { path = "../forge-protocol" }
forge-git = { path = "../forge-git" }
forge-diff = { path = "../forge-diff" }
forge-buffer = { path = "../forge-buffer" }
github-copilot-sdk = { version = "=1.0.7", default-features = false, features = ["derive"] }
hex = "0.4"
home = "0.5"
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "process-group", "creation-flags"] }
jsonschema = { version = "0.49", default-features = false }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "=1.2.2"
semver = "1.0"
syn = { version = "2.0", features = ["full", "visit-mut"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.10"
similar = "3.1.1"
spdx = "0.13.4"
strip-ansi-escapes = "0.2.1"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
tempfile = "3.23"
toml = "0.9"
tree-sitter = "=0.27.0"
tree-sitter-powershell = "=0.26.4"
tree-sitter-bash = "=0.25.1"
tree-sitter-zsh = "=0.63.4"
uuid = { version = "1.18", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }
