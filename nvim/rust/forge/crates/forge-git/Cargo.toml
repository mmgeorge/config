[package]
name = "forge-git"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
anyhow = "1.0"
dunce = "1.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
forge-diff = { path = "../forge-diff" }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256", "parallel", "attributes", "status"] }
tokio = { version = "1.48", features = ["rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
