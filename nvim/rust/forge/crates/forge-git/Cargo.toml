[package]
name = "forge-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes `forge_git::test_support`, in-process fixture repositories, to dependents' tests.
test-fixtures = []

[dependencies]
anyhow = { workspace = true }
dunce = { workspace = true }
forge-diff = { workspace = true }
gix = { workspace = true, features = ["sha1", "sha256", "parallel", "attributes", "status", "revision"] }
process-wrap = { workspace = true, features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
# Enables `test-fixtures` for this crate's own integration tests.
forge-git = { path = ".", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
