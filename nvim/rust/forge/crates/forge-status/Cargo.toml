[package]
name = "forge-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
forge-buffer = { path = "../forge-buffer" }
forge-git = { path = "../forge-git" }
forge-diff = { path = "../forge-diff" }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["sync", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
