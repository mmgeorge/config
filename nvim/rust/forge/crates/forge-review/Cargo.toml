[package]
name = "forge-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
forge-buffer = { workspace = true }
forge-diff = { workspace = true }
forge-git = { workspace = true }
forge-github = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
forge-recorded-fixtures = { workspace = true }
forge-git = { workspace = true, features = ["test-fixtures"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
