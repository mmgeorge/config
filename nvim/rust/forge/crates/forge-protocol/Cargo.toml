[package]
name = "forge-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
tokio = { version = "1.48", features = ["io-util", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt"] }
