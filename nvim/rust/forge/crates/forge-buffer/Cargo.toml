[package]
name = "forge-buffer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
tokio = { version = "1.48", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
serde_json = "1.0"
