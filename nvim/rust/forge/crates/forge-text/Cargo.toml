[package]
name = "forge-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symspell_rs = "=7.0.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt", "sync", "time"] }
unicode-segmentation = "=1.12.0"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
