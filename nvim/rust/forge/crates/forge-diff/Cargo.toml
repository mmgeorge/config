[package]
name = "forge-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-buffer = { workspace = true }
imara-diff = { workspace = true }
jsonc-parser = { workspace = true, features = ["serde"] }
memchr = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-glsl = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-language = { workspace = true }
tree-sitter-lua = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-nu = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-query = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-slang = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-vim = { workspace = true }
tree-sitter-vimdoc = { workspace = true }
tree-sitter-yaml = { workspace = true }

[build-dependencies]
cc = { workspace = true, features = ["parallel"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
