[build]
rustflags = ["-Zthreads=8"]

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
linker = "rust-lld"
# Atomic Windows job assignment uses Tokio's custom native-process spawn hook.
# Target rustflags replace build.rustflags, so retain the parallel frontend here.
rustflags = ["-Zthreads=8", "--cfg", "tokio_unstable", "-C", "link-arg=/DEBUG:NONE"]
