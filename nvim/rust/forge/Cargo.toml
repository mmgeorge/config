[package]
name = "forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace]
resolver = "3"
members = ["crates/forge-buffer", "crates/forge-protocol", "crates/forge-harness", "crates/forge-git", "crates/forge-diff", "crates/forge-github", "crates/forge-review", "crates/forge-status"]
exclude = ["vendor/gix-path"]

[patch.crates-io]
gix-path = { path = "vendor/gix-path" }

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
forge-harness = { path = "crates/forge-harness" }
forge-git = { path = "crates/forge-git" }
forge-github = { path = "crates/forge-github" }
forge-diff = { path = "crates/forge-diff" }
forge-protocol = { path = "crates/forge-protocol" }
forge-review = { path = "crates/forge-review" }
forge-buffer = { path = "crates/forge-buffer" }
forge-status = { path = "crates/forge-status" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23"
toml = "0.9"

[profile.release]
debug = 1
