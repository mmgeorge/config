# Setup scripts are experimental in nextest, so pin the release that introduced the current format.
nextest-version = { required = "0.9.98" }
experimental = ["setup-scripts"]

# Build the seeded Git template once per run for broker fixtures; see `git_template.nu`.
[scripts.setup.git-template]
command = "nu .config/git_template.nu"

# Every Forge test must be deterministic and nearly instant. A test still running after two
# seconds is terminated and reported as a failure, so a hang or a real-clock wait fails fast
# instead of stalling the run. Fix or remove a slow test. The overrides below are the only
# exceptions; each names the cost that keeps its tests above the limit. Add one only when that
# cost is what the test verifies, and record the reason beside it.
[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }
# Report every failure in one run rather than stopping at the first.
fail-fast = false
# Many tests spawn git and host processes; running more at once than this starves them past the
# two-second limit on a 24-thread machine, so parallelism is capped rather than the limit raised.
test-threads = 8

[[profile.default.scripts]]
filter = "package(forge-harness)"
setup = "git-template"

# Exceptions get ten seconds: five times the slowest serial duration measured for any of them,
# which still terminates a hang quickly.

# These tests launch the built `forge` executable and talk to it over stdio, because the stdio
# contract is what they verify. Each pays host process startup, and the GitHub tests among them
# also launch the compiled `gh` fixture once per request.
[[profile.default.overrides]]
filter = "package(forge) & (binary(repository_stdio) | binary(harness_broker_stdio))"
slow-timeout = { period = "10s", terminate-after = 1 }

# These tests verify the `gh` process contract: arguments, input files, admission, and reaping
# abandoned children. Each test process compiles `tests/fixtures/gh.rs` with `rustc` once, which
# costs about a second before the first request, then launches it per request. Replacing `gh`
# with an in-process HTTP client removes this exception; see `octo-plan-followup.md` at the
# repository root.
[[profile.default.overrides]]
filter = "package(forge-github) & binary(gh_client)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Checkpoint capture runs `git status` and `git ls-files` for every capture, about 170 ms per
# capture on Windows, and these tests verify that real Git view of the worktree. The reuse test
# captures seven times and takes 1.4 s alone.
[[profile.default.overrides]]
filter = "package(forge-harness) & test(/^checkpoint::capture::test::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# These broker tests run turns in a Git workspace, and the broker captures a checkpoint before
# and after each turn, so every turn adds the two Git launches above. They verify checkpoint
# interaction: rollback on abort, a locked file blocking resume, and automatic checks triggered by
# the checkpoint diff. Run alone, they take 0.8 to 2.0 s.
[[profile.default.overrides]]
filter = """package(forge-harness) & (
    test(=broker::test::admission::admission_precedes_preparation_and_settles_success_failure_and_cancellation)
    | test(=broker::test::automatic_checks_complete_when_remaining_queue_is_removed)
    | test(=broker::test::automatic_checks_default_off_until_explicitly_enabled)
    | test(=broker::test::automatic_checks_repair_after_permission_resume_on_worker)
    | test(=broker::test::goal_resume_retries_locked_checkpoint_before_provider_work)
    | test(=broker::test::input::deferred_steering_cancellation_preserves_acceptance_boundary)
    | test(=broker::test::native_abort_completion_rewinds_before_pending_checkpoint_finalization)
)"""
slow-timeout = { period = "10s", terminate-after = 1 }

# These broker tests use plain workspaces and launch no processes, but each drives several
# parent and child turns, or both direct and admitted sandbox transitions, through the real
# broker and mock provider. The fastest agent tests take 0.3 s at eight threads, and these run
# several of those cycles. The sandbox test takes 1.8 s alone.
[[profile.default.overrides]]
filter = """package(forge-harness) & (
    test(=broker::test::agent::suspended_parent_joins_children_before_resuming)
    | test(=broker::test::agent::user_decision_holds_parent_until_answered_before_delivering_child_results)
    | test(=broker::test::agent::user_input_wakes_suspended_parent_without_native_steering)
    | test(=broker::test::yolo_toggles_sandbox_in_direct_and_admitted_transitions)
)"""
slow-timeout = { period = "10s", terminate-after = 1 }

# These tests start the whole in-process `HarnessService`: session registry, SQLite stores and
# the mock provider runtime. They then drive owner transitions, configuration retries or task
# controls across several requests. Service tests take a median 0.65 s at eight threads, and
# these multi-request ones take 0.6 to 1.1 s alone, so load pushes them past two seconds.
# `goal_continue_aliases_reuse_the_completed_source_and_receipt_*` also fails intermittently for
# reasons unrelated to duration. This exception does not cover that failure, which still needs a fix.
[[profile.default.overrides]]
filter = """package(forge-harness) & (
    test(=service::session_observation_test::failed_session_observation_restarts_for_explicit_new_work)
    | test(=service::session_observation_test::session_observation_intake_does_not_block_on_foreground_broker)
    | test(=service::tests::configuration_retry::latest_configuration_waits_for_actual_child_end_and_preserves_canceled_root)
    | test(=service::tests::owner_cancel::owner_active_overdue_cancel_recovers_when_late_collection_completes)
    | test(/^service::tests::owner_transition::/)
    | test(=service::tests::task_presentation::plan_cancellation_retires_open_status_and_reopens_idle)
    | test(/^service::tests::task_state::goal_continue_aliases_reuse_the_completed_source_and_receipt_/)
    | test(=service::tests::task_state::queued_input_edited_to_goal_starts_once_and_preserves_other_input)
    | test(/^service::tests::task_state::task_control_aliases_collect_active_work_and_replay_owner_receipts_/)
)"""
slow-timeout = { period = "10s", terminate-after = 1 }
