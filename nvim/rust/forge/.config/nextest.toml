# Setup scripts are experimental in nextest, so pin the release that introduced the current format.
nextest-version = { required = "0.9.98" }
experimental = ["setup-scripts"]

# Build the seeded Git template once per run for broker fixtures; see `git_template.nu`.
[scripts.setup.git-template]
command = "nu .config/git_template.nu"

# Every Forge test must be deterministic and nearly instant. A test still running after two
# seconds is terminated and reported as a failure, so a hang or a real-clock wait fails fast
# instead of stalling the run. Fix or remove a slow test. The overrides below are the only
# exceptions. Each matches a whole suite and names the cost its tests share, which is either what
# the suite verifies or the fixture that its high-value invariants need. Record the reason beside
# any new exception.
[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }
# Report every failure in one run rather than stopping at the first.
fail-fast = false
# Many tests spawn git and host processes; running more at once than this starves them past the
# two-second limit on a 24-thread machine, so parallelism is capped rather than the limit raised.
test-threads = 8

[[profile.default.scripts]]
filter = "package(forge-harness)"
setup = "git-template"

# Exceptions get ten seconds: five times the slowest serial duration measured in them, which still
# terminates a hang quickly. Their tests take up to two seconds alone, so machine load alone
# pushes them over the default limit.

# Stdio suites: these tests launch the built `forge` executable and talk to it over stdio,
# because the stdio contract is what they verify. Each pays host process startup, and the GitHub
# tests among them also launch the compiled `gh` fixture once per request.
[[profile.default.overrides]]
filter = "package(forge) & (binary(repository_stdio) | binary(harness_broker_stdio))"
slow-timeout = { period = "10s", terminate-after = 1 }

# `gh` client suite: these tests verify the `gh` process contract, which covers arguments, input
# files, admission and reaping abandoned children. Each test process compiles
# `tests/fixtures/gh.rs` with `rustc` once, about a second before the first request, then launches
# it per request. Replacing `gh` with an in-process HTTP client removes this exception; see
# `octo-plan-followup.md` at the repository root.
[[profile.default.overrides]]
filter = "package(forge-github) & binary(gh_client)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Git writer suite: the writer's contract is how real Git applies its config, index and worktree
# writes, so these tests launch `git` for both the write and the check.
[[profile.default.overrides]]
filter = "package(forge-git) & test(/^writer::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Status writer suite: status actions stage, unstage and discard through Git, and these tests
# check the result against real `git diff --cached` and `git show`.
[[profile.default.overrides]]
filter = "package(forge-status) & test(/^tests::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Status source documents: bounded delivery is the contract, so the large-source test builds a
# source of about 18 MB, which is larger than one transfer, and streams it in bounded chunks.
[[profile.default.overrides]]
filter = "package(forge-status) & test(/^source_document::tests::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Spelling model suites: these tests decide corrections with the bundled model, built from the
# 82,765-word unigram and 243,342-pair bigram dictionaries. Nextest runs every test in its own
# process, so the shared `OnceLock` cannot reuse the model, and every test builds it again.
[[profile.default.overrides]]
filter = "package(forge-text) & (test(/^model::tests::/) | test(/^service::tests::/))"
slow-timeout = { period = "10s", terminate-after = 1 }

# Checkpoint suite: capture runs `git status` and `git ls-files` each time, about 170 ms per
# capture on Windows, and these tests verify that real Git view of the worktree.
[[profile.default.overrides]]
filter = "package(forge-harness) & test(/^checkpoint::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Broker suite: these tests drive turns, child agents, plans and checks through the real broker
# and the mock provider. Tests on a Git workspace also pay a real checkpoint capture before and
# after every turn, which is how they verify rollback, resume and automatic checks. Each test
# runs several such turns.
[[profile.default.overrides]]
filter = "package(forge-harness) & test(/^broker::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Service suite: these tests start the whole in-process `HarnessService`, which covers the session
# registry, SQLite stores and the mock provider runtime. They guard ownership invariants that
# lose work or leak a provider when broken: cancellation and configuration changes collect the
# work they replace, closing one session preserves its siblings, observation never blocks the
# foreground broker, and tasks start exactly once. Service tests take a median 0.65 s at eight
# threads, and the multi-request ones take up to two seconds.
[[profile.default.overrides]]
filter = "package(forge-harness) & test(/^service::/)"
slow-timeout = { period = "10s", terminate-after = 1 }

# Provider owner conformance suite: every scenario runs once for each owner implementation, and
# the backpressure scenario pushes ordered output past queue capacity while a successor
# interrupts, because surviving that volume is what it verifies.
[[profile.default.overrides]]
filter = "package(forge-harness) & test(/^provider::session_execution::runtime::owner_conformance::/)"
slow-timeout = { period = "10s", terminate-after = 1 }
